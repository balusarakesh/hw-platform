{{- if .Values.runnerServiceAccount.create }}
# Runner pods run as this SA; terraform/ci binds the hw-ci-push IAM role to it with Pod Identity.
# No Kubernetes RBAC is attached and the token isn't mounted (automountServiceAccountToken: false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "runnerServiceAccount.name is required" .Values.runnerServiceAccount.name }}
automountServiceAccountToken: false
{{- end }}
