# GitHub App credentials for runner registration, in the key names ARC expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Must exist before the AutoscalingRunnerSet references it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef: { key: {{ .Values.githubAppSecretKey }}, property: app_id }
    - secretKey: github_app_installation_id
      remoteRef: { key: {{ .Values.githubAppSecretKey }}, property: installation_id }
    - secretKey: github_app_private_key
      remoteRef: { key: {{ .Values.githubAppSecretKey }}, property: private_key }
{{- if .Values.argocdToken.enabled }}
---
# Read-only ArgoCD API token (local account pr-diff) used by `argocd app diff`.
# Created by scripts/argocd-pr-diff-token.sh; until then this ExternalSecret reports an error and the
# runner env var is simply absent (optional), so runners still start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-pr-diff-token
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: argocd-pr-diff-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: {{ .Values.argocdTokenSecretKey }} }
{{- end }}
