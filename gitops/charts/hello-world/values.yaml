# Defaults only; environment-specific values come from gitops/apps/hello-world/values.yaml.

region: ""

image:
  repository: ""
  tag: ""
  # Always deploy by digest; the tag is there for humans.
  digest: ""

# Used only when the HPA is disabled.
replicas: 2

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# IAM comes from EKS Pod Identity associations keyed on these SA names (terraform/cluster/pod_identity.tf).
serviceAccount:
  name: hello-world

db:
  host: ""
  port: "5432"
  name: ""
  user: hw_app

dbBootstrap:
  enabled: true
  serviceAccountName: hello-world-db-bootstrap
  masterUsername: ""
  masterSecretArn: ""

ingress:
  host: ""
  certificateArn: ""
  # Fixed IngressGroup: every Ingress in the group shares one ALB whose name/tags stay stable.
  groupName: hw

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 250m, memory: 128Mi }
