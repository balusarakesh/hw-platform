apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
  annotations:
    # IRSA: pods using this SA get creds for a role that can only rds-db:connect as db.user.
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required" .Values.serviceAccount.roleArn | quote }}
# The app never talks to the Kubernetes API.
automountServiceAccountToken: false
