apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  # With the HPA on, replicas is left unset so ArgoCD doesn't fight the autoscaler.
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hello-world.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello-world.selectorLabels" . | nindent 8 }}
        # Opt-in label the CloudWatch agent's Prometheus scrape config selects on.
        hw.io/scrape: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "hello-world.podSecurityContext" . | nindent 8 }}
      # Spread replicas across nodes so one node failure doesn't take the app down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hello-world.selectorLabels" . | nindent 14 }}
      # preStop sleep (10s) + the app's own readiness flip and shutdown delay (SHUTDOWN_DELAY, 10s) +
      # connection drain must fit inside this.
      terminationGracePeriodSeconds: 45
      containers:
        - name: hello-world
          image: {{ include "hello-world.image" . }}
          imagePullPolicy: IfNotPresent
          args: [serve]
          # Keep serving while the ALB and kube-proxy stop routing to this pod (native sleep action,
          # no shell needed in the distroless image).
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: 8080
            # Prometheus metrics; scraped in-cluster by pod IP only. Not in the Service or Ingress.
            - name: metrics
              containerPort: 9090
          env:
            {{- include "hello-world.dbEnv" . | nindent 12 }}
            - { name: LISTEN_ADDR, value: ":8080" }
            {{- if .Values.tracing.enabled }}
            # OpenTelemetry -> CloudWatch agent (OTLP/HTTP) -> X-Ray.
            - { name: OTEL_SERVICE_NAME, value: hello-world }
            - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: {{ .Values.tracing.endpoint | quote }} }
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: {{ .Values.tracing.sampleRatio | quote }} }
            {{- end }}
            - { name: METRICS_ADDR, value: ":9090" }
          securityContext:
            {{- include "hello-world.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Liveness: is the process healthy? (no dependencies, so a DB blip never restarts pods)
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: can it serve? (see app/main.go for why a paused DB doesn't fail it)
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
