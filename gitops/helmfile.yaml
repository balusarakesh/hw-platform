# Everything that runs in the cluster. Each app has a folder under apps/<name>/ with its ArgoCD
# Application (application.yaml) and its Helm values (values.yaml). ArgoCD renders one release per
# Application (`--selector name=<release>`) through the helmfile Config Management Plugin.
# Values only Terraform knows (IDs, ARNs) are `ref+awsssm://hw/gitops/...` strings that helmfile
# resolves at render time.

repositories:
  - name: kyverno
    url: https://kyverno.github.io/kyverno
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: eks
    url: https://aws.github.io/eks-charts
  - name: external-dns
    url: https://kubernetes-sigs.github.io/external-dns
  - name: autoscaler
    url: https://kubernetes.github.io/autoscaler
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: runatlantis
    url: https://runatlantis.github.io/helm-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: arc
    url: ghcr.io/actions/actions-runner-controller-charts
    oci: true

releases:
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 10.10.5
    values:
      - apps/argocd/values.yaml

  - name: aws-load-balancer-controller
    namespace: kube-system
    chart: eks/aws-load-balancer-controller
    version: 3.6.1
    values:
      - apps/aws-load-balancer-controller/values.yaml

  - name: external-dns
    namespace: external-dns
    chart: external-dns/external-dns
    version: 1.23.0
    values:
      - apps/external-dns/values.yaml

  - name: cluster-autoscaler
    namespace: kube-system
    chart: autoscaler/cluster-autoscaler
    version: 9.59.0
    values:
      - apps/cluster-autoscaler/values.yaml

  - name: hello-world
    namespace: hello-world
    chart: ./charts/hello-world
    values:
      - apps/hello-world/values.yaml

  # Metrics sources for CloudWatch alarms (scraped by the cloudwatch-agent-prometheus workload
  # from the amazon-cloudwatch-observability EKS addon).
  - name: node-exporter
    namespace: node-exporter
    chart: prometheus-community/prometheus-node-exporter
    version: 4.60.0
    values:
      - apps/node-exporter/values.yaml

  - name: kube-state-metrics
    namespace: monitoring
    chart: prometheus-community/kube-state-metrics
    version: 8.6.0
    values:
      - apps/kube-state-metrics/values.yaml

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 2.14.0
    values:
      - apps/external-secrets/values.yaml

  # In-cluster GitHub Actions runners for the ArgoCD PR diff workflow.
  - name: arc-controller
    namespace: arc-systems
    chart: arc/gha-runner-scale-set-controller
    version: 0.15.1
    values:
      - apps/arc-controller/values.yaml

  - name: arc-runners
    namespace: arc-runners
    chart: ./charts/arc-runners
    values:
      - apps/arc-runners/values.yaml

  - name: atlantis
    namespace: atlantis
    chart: runatlantis/atlantis
    version: 6.16.2
    values:
      - apps/atlantis/values.yaml

  - name: arc-runners-push
    namespace: arc-runners-push
    chart: ./charts/arc-runners
    values:
      - apps/arc-runners-push/values.yaml

  - name: kyverno
    namespace: kyverno
    chart: kyverno/kyverno
    version: 3.9.2
    values:
      - apps/kyverno/values.yaml

  - name: image-policies
    namespace: kyverno
    chart: ./charts/image-policies
    values:
      - apps/image-policies/values.yaml

  # Default-deny NetworkPolicies + explicit allows for every namespace we own (one place to review).
  - name: network-policies
    namespace: argocd
    chart: ./charts/network-policies
    values:
      - apps/network-policies/values.yaml

  - name: vertical-pod-autoscaler
    namespace: vpa-system
    chart: autoscaler/vertical-pod-autoscaler
    version: 0.15.0
    values:
      - apps/vertical-pod-autoscaler/values.yaml
