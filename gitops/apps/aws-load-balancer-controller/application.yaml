# Rendered by the helmfile plugin: `helmfile --selector name=aws-load-balancer-controller template`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/balusarakesh/hw-platform.git
    targetRevision: main
    path: gitops
    plugin:
      name: helmfile
      env:
        - name: RELEASE
          value: aws-load-balancer-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # The chart generates a new self-signed webhook CA/cert on every render. Without this, every sync
  # rotated the webhook cert and every PR diff showed caBundle/tls.* changes.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - kind: Secret
      name: aws-load-balancer-tls
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
