# Values for the aws-load-balancer-controller Helm release. `ref+awsssm://...` strings are resolved by helmfile (vals)
# at render time from SSM /hw/gitops/*, which Terraform writes; nothing account-specific is in git.
clusterName: "ref+awsssm://hw/gitops/cluster_name"
region: "ref+awsssm://hw/gitops/region"
vpcId: "ref+awsssm://hw/gitops/vpc_id"

image:
  repository: public.ecr.aws/eks/aws-load-balancer-controller
  tag: v3.6.1@sha256:954b5233e17128a18d12f7fcaac4c7ed792dea4bba0beeb5d450c5a4538e3394

replicaCount: 1

serviceAccount:
  create: true
  # IAM via Pod Identity association (Terraform), no annotation needed.
  name: aws-load-balancer-controller

# Only reconcile Ingresses/Services we explicitly hand to it; don't hijack every type=LoadBalancer.
enableServiceMutatorWebhook: false

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { cpu: 200m, memory: 256Mi }
