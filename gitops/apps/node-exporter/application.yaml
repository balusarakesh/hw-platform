# Rendered by the helmfile plugin: `helmfile --selector name=node-exporter template`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/balusarakesh/hw-platform.git
    targetRevision: main
    path: gitops
    plugin:
      name: helmfile
      env:
        - name: RELEASE
          value: node-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: node-exporter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # hostNetwork/hostPID are disallowed by the "baseline" and "restricted" levels, so this one
        # namespace is "privileged". The pod itself still runs non-root, no capabilities, read-only rootfs;
        # "warn: restricted" keeps the deviation visible on every apply.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: restricted
