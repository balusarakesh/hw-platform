# Rendered by the helmfile plugin: `helmfile --selector name=kyverno template`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  annotations:
    # kyverno (CRDs + webhook) first, then the policies.
    argocd.argoproj.io/sync-wave: "-1"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/balusarakesh/hw-platform.git
    targetRevision: main
    path: gitops
    plugin:
      name: helmfile
      env:
        - name: RELEASE
          value: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # Client-side diff with one targeted ignore. Server-side diff made argocd-server load all of
  # Kyverno's (very large) CRDs per diff and OOMKilled it even at 1Gi. The only drift was the chart
  # rendering empty `labels: {}` / `annotations: {}` on CRDs, which the API server drops.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers: [/metadata/labels, /metadata/annotations]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
