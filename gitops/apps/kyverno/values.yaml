# Kyverno: only the admission controller, used to verify cosign signatures on hello-world images
# (policy in apps/image-policies). Background/cleanup/reports controllers are off: not needed for
# admission-time checks and they'd cost CPU/memory on the small nodes.
crds:
  install: true
  migration:
    enabled: false

admissionController:
  replicas: 1
  initContainer:
    image:
      registry: reg.kyverno.io
      repository: kyverno/kyvernopre
      tag: v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 256Mi }
  container:
    image:
      registry: reg.kyverno.io
      repository: kyverno/kyverno
      tag: v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  # IAM via Pod Identity (terraform/ci/verify.tf): ECR read on hello-world, to fetch signatures.
  serviceAccount:
    name: kyverno-admission-controller

backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false
webhooksCleanup:
  enabled: false
