# Rendered by the helmfile plugin: `helmfile --selector name=hello-world template`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/balusarakesh/hw-platform.git
    targetRevision: main
    path: gitops
    plugin:
      name: helmfile
      env:
        - name: RELEASE
          value: hello-world
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        # LB controller injects a readiness gate: a pod only counts as Ready once the ALB reports its
        # target healthy, so rollouts never remove old pods before new targets can take traffic.
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
