# Values for the hello-world Helm release. `ref+awsssm://...` strings are resolved by helmfile (vals)
# at render time from SSM /hw/gitops/*, which Terraform writes; nothing account-specific is in git.
region: "ref+awsssm://hw/gitops/region"

image:
  repository: "ref+awsssm://hw/gitops/ecr_repository_url"
  # tag = git commit SHA, digest pins the exact image. CI's image-bump PR rewrites these two lines.
  tag: "c524756b55037992fb2060448a435467e33f5d41"
  digest: "sha256:d0fcb8e93fbed061d138485d71c5924d50f743bbb8ab540936bd33d86c8b2f57"

db:
  host: "ref+awsssm://hw/gitops/db_host"
  port: "ref+awsssm://hw/gitops/db_port"
  name: "ref+awsssm://hw/gitops/db_name"
  user: "ref+awsssm://hw/gitops/db_app_user"

dbBootstrap:
  masterUsername: "ref+awsssm://hw/gitops/db_master_username"
  masterSecretArn: "ref+awsssm://hw/gitops/db_master_secret_arn"

ingress:
  host: "ref+awsssm://hw/gitops/app_host"
  certificateArn: "ref+awsssm://hw/gitops/acm_certificate_arn"
  wafAclArn: "ref+awsssm://hw/gitops/waf_acl_arn"

# Scales on CPU/memory between min and max. Hitting max raises the hw-hpa-at-max alarm (Phase 2).
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
