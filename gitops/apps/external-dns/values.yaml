# Values for the external-dns Helm release. `ref+awsssm://...` strings are resolved by helmfile (vals)
# at render time from SSM /hw/gitops/*, which Terraform writes; nothing account-specific is in git.
image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3

provider:
  name: aws

env:
  - name: AWS_DEFAULT_REGION
    value: "ref+awsssm://hw/gitops/region"

serviceAccount:
  create: true
  # IAM via Pod Identity association (Terraform), no annotation needed.
  name: external-dns

sources: [ingress]
domainFilters:
  - "ref+awsssm://hw/gitops/domain"
extraArgs:
  - "--zone-id-filter=ref+awsssm://hw/gitops/hosted_zone_id+"
  - --aws-zone-type=public

# sync = also delete records it created; TXT ownership records stop it touching anything else.
policy: sync
registry: txt
txtOwnerId: hw

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 100m, memory: 128Mi }
