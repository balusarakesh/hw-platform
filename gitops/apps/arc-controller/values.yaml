# Actions Runner Controller (ARC): watches AutoscalingRunnerSets and starts ephemeral runner pods
# when GitHub has jobs for them. It only talks to the Kubernetes API and GitHub; no AWS access.
fullnameOverride: arc-controller

image:
  repository: ghcr.io/actions/gha-runner-scale-set-controller
  tag: 0.15.1@sha256:4b51a20db717b194e2f3fa96cfe2ddcb21602811f79053c75fd1a383517b9f90

flags:
  logLevel: info
  logFormat: json

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { cpu: 200m, memory: 256Mi }
