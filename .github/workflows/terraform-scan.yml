# Static checks for every Terraform change (Atlantis does the plan). tflint per stack, checkov for
# the whole tree with the repo's documented skips (.checkov.yaml).
name: terraform-scan

on:
  pull_request:
    paths: ["terraform/**", ".checkov.yaml", ".github/workflows/terraform-scan.yml"]

permissions:
  contents: read

concurrency:
  group: terraform-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: terraform-scan
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        run: |
          for d in terraform/bootstrap terraform/persistent terraform/cluster terraform/alarms terraform/ci terraform/modules/*/; do
            [ -d "$d" ] || continue
            echo "::group::tflint $d"
            (cd "$d" && tflint --init >/dev/null && tflint --format compact)
            echo "::endgroup::"
          done
      - name: checkov
        run: |
          pipx run --spec "checkov==3.3.30" checkov -d terraform --config-file .checkov.yaml --compact --quiet
