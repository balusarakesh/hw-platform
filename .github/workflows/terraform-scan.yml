# Static checks for every Terraform change (Atlantis does the plan). tflint per stack, checkov for
# the whole tree with the repo's documented skips (.checkov.yaml).
name: terraform-scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every PR so the required checks always report; the real jobs skip (= pass) when their
  # files didn't change. (Workflow-level `paths:` would leave required checks pending forever.)
  changes:
    name: changes
    runs-on: ubuntu-24.04-arm
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PATTERN: '^(terraform/|\.checkov\.yaml$|\.github/workflows/terraform-scan\.yml$)'
        run: |
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${BASE}" HEAD | grep -qE "${PATTERN}"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  scan:
    name: terraform-scan
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        run: |
          for d in terraform/bootstrap terraform/persistent terraform/cluster terraform/alarms terraform/ci terraform/modules/*/; do
            [ -d "$d" ] || continue
            echo "::group::tflint $d"
            (cd "$d" && tflint --init >/dev/null && tflint --format compact)
            echo "::endgroup::"
          done
      - name: checkov
        run: |
          pipx run --spec "checkov==3.3.30" checkov -d terraform --config-file .checkov.yaml --compact --quiet
